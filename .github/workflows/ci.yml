name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repo. No secrets are used here.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  chaos-target-image:
    name: chaos-target Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Same build Render runs: repo root as context (render.yaml).
      - name: Build
        run: docker build -f apps/chaos-target/Dockerfile -t chaos-target .

      - name: Smoke test
        run: |
          docker run -d --name chaos-target -p 3000:3000 chaos-target
          for i in $(seq 1 20); do
            curl -fsS localhost:3000/ping && break
            sleep 1
          done
          curl -fsS localhost:3000/ping
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/status/503)" = 503
          curl -fsS localhost:3000/schedule > /dev/null

      - name: Container logs
        if: always()
        run: docker logs chaos-target || true
